<script>
  /* ============================================================
     ⚠️ GANTI URL DI BAWAH INI DENGAN URL WEB APP ANDA
     ============================================================ */
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyl3V2Qjl9igHBq6UGGqMwKi-rVWLRQznwxb1CEEKBIeMjbhdvtq8DoGGU1xQWcK2hftQ/exec";
  /* ============================================================ */

  const ADMIN_PASSWORD = "muhammadiyah001";
  const form = document.getElementById('pollForm');
  const submitBtn = document.getElementById('submitBtn');
  const successAlert = document.getElementById('successAlert');
  const errorAlert = document.getElementById('errorAlert');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    successAlert.style.display = 'none';
    errorAlert.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loading"></span>Mengirim...';

    const data = {
      action: 'submit',
      namaOrtu: document.getElementById('namaOrtu').value.trim(),
      namaSiswa: document.getElementById('namaSiswa').value.trim(),
      kelas: document.getElementById('kelas').value,
      pilihan: document.querySelector('input[name="pilihan"]:checked').value,
      masukan: document.getElementById('masukan').value.trim()
    };

    // COBA METODE 1: Fetch dengan text/plain (paling umum berhasil)
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      
      // Karena no-cors, kita tidak bisa baca response
      // Tapi request akan terkirim. Tampilkan sukses.
      successAlert.style.display = 'block';
      form.reset();
      setTimeout(() => { successAlert.style.display = 'none'; }, 5000);
    } catch (err1) {
      console.warn('Metode 1 gagal, coba metode 2...', err1);
      
      // COBA METODE 2: Form tradisional via hidden iframe (100% reliable)
      try {
        await submitViaForm(data);
        successAlert.style.display = 'block';
        form.reset();
        setTimeout(() => { successAlert.style.display = 'none'; }, 5000);
      } catch (err2) {
        console.error('Kedua metode gagal:', err2);
        errorAlert.style.display = 'block';
        errorAlert.innerHTML = '❌ Gagal mengirim. Silakan coba lagi. <br><small>' + err2.message + '</small>';
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Kirim Pilihan';
    }
  });

  /**
   * METODE 2: Submit via form tradisional + hidden iframe
   * Ini bypass CORS sepenuhnya dan PASTI berhasil untuk Apps Script
   */
  function submitViaForm(data) {
    return new Promise((resolve, reject) => {
      // Buat iframe tersembunyi
      const iframe = document.createElement('iframe');
      iframe.name = 'hidden_iframe_' + Date.now();
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      // Buat form
      const formEl = document.createElement('form');
      formEl.method = 'POST';
      formEl.action = SCRIPT_URL;
      formEl.target = iframe.name;
      formEl.style.display = 'none';

      // Tambahkan data sebagai hidden input
      // Apps Script akan terima sebagai e.parameter
      Object.keys(data).forEach(key => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = data[key];
        formEl.appendChild(input);
      });

      document.body.appendChild(formEl);

      // Handle response dari iframe
      let responded = false;
      iframe.onload = () => {
        if (responded) return;
        responded = true;
        try {
          // Bersihkan
          setTimeout(() => {
            document.body.removeChild(iframe);
            document.body.removeChild(formEl);
          }, 1000);
          resolve();
        } catch (err) {
          reject(err);
        }
      };

      // Timeout fallback
      setTimeout(() => {
        if (!responded) {
          responded = true;
          try {
            document.body.removeChild(iframe);
            document.body.removeChild(formEl);
          } catch(e) {}
          // Anggap berhasil karena Apps Script biasanya redirect
          resolve();
        }
      }, 10000);

      // Submit!
      formEl.submit();
    });
  }

  /* ====== ADMIN SIDEBAR (sama seperti sebelumnya) ====== */
  function openAdminLogin() {
    const pwd = prompt("Masukkan password admin:");
    if (pwd === ADMIN_PASSWORD) {
      openSidebar();
      loadSummary();
    } else if (pwd !== null) {
      alert("Password salah!");
    }
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.add('active');
    document.getElementById('overlay').classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('active');
    document.getElementById('overlay').classList.remove('active');
  }

  async function loadSummary() {
    const url = SCRIPT_URL + '?action=summary';
    try {
      const res = await fetch(url, { redirect: 'follow' });
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch(e) {
        // Kadang Apps Script return HTML redirect page
        throw new Error('Response bukan JSON. Periksa URL App Script Anda.');
      }
      renderSummary(data);
    } catch (err) {
      alert("Gagal memuat data: " + err.message + "\n\nPastikan URL App Script benar dan sudah di-authorize.");
      console.error(err);
    }
  }

  function renderSummary(data) {
    const total = data.total || 0;
    const tm = data.tatapMuka || 0;
    const ol = data.online || 0;
    const percentTM = total > 0 ? ((tm / total) * 100).toFixed(1) : 0;
    const percentOL = total > 0 ? ((ol / total) * 100).toFixed(1) : 0;

    document.getElementById('totalPoll').textContent = total;
    document.getElementById('totalKelas').textContent = data.jumlahKelas || 0;
    document.getElementById('countTM').textContent = tm;
    document.getElementById('countOL').textContent = ol;
    document.getElementById('percentTM').textContent = percentTM + '%';
    document.getElementById('percentOL').textContent = percentOL + '%';
    document.getElementById('barTM').style.width = percentTM + '%';
    document.getElementById('barTM').textContent = percentTM + '%';
    document.getElementById('barOL').style.width = percentOL + '%';
    document.getElementById('barOL').textContent = percentOL + '%';

    const fbList = document.getElementById('feedbackList');
    if (data.feedback && data.feedback.length > 0) {
      fbList.innerHTML = data.feedback.map(f => `
        <div class="feedback-item">
          <span class="name">${escapeHtml(f.namaOrtu)}</span>
          <span class="choice ${f.pilihan === 'Tatap Muka' ? 'tatapmuka' : 'online'}">${f.pilihan}</span>
          <div style="font-size:0.75rem; color:#9ca3af;">${escapeHtml(f.namaSiswa)} - ${escapeHtml(f.kelas)}</div>
          ${f.masukan ? `<div class="msg">"${escapeHtml(f.masukan)}"</div>` : ''}
        </div>
      `).join('');
    } else {
      fbList.innerHTML = '<p style="color:#9ca3af; text-align:center; padding:10px;">Belum ada masukan.</p>';
    }
    document.getElementById('printDate').textContent =
      'Dicetak pada: ' + new Date().toLocaleString('id-ID');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
</script>
